name = "arl-openrouter-proxy"
main = "src/index.js"
compatibility_date = "2026-09-10"

[observability]
enabled = true

[vars]
# Only what the gate's OpenRouter lenses actually run. Adding a model here is the
# only way to make it spendable through this proxy — that is the point, not an
# oversight. Normally the correctness lens runs on codex against a ChatGPT
# subscription and never touches this worker; gpt-5.6-luna is listed so the
# codex-free fallback (ARL_GATE=nocodex) can keep the correctness lens on the
# same model when that subscription is out of usage. At $0.20/$1.20 per Mtok it
# is cheaper than the two Gemini lenses it runs beside.
ALLOWED_MODELS = "google/gemini-3.8-flash,openai/gpt-5.6-luna"
# Raised 4000 -> 16000 on 2026-09-10. At 4000 the data lens was truncated mid-
# reasoning on diffs over about 900 lines and never reached its VERDICT line, so
# the harness recorded a synthetic REJECT and the gate silently degraded to two
# lenses. Fails safe, but indistinguishable from a real finding without reading
# the log body.
MAX_TOKENS = "16000"

# 30 requests/min per IP. A panel run is 2 OpenRouter calls, so this is ~15
# concurrent reviews — far above real use, low enough to bound a runaway loop.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

# Secrets (NOT here — set with `wrangler secret put`):
#   OPENROUTER_API_KEY  the real metered key, server-side only
#   APP_TOKEN           what callers present; rotate by re-putting it
